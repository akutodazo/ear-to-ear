name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7 は node24 で動く（v4 は Node 20 で非推奨の注記が出ていた）
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 安全検査 → lint → 型 → テスト → build（AGENTS.md）
      - run: npm run check
