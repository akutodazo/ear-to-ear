name: deploy

# main に入ったら dev へ。demo は Actions の画面の「Run workflow」で人が押したときだけ（11-04 本人決定）。
# pull_request では動かさない（フォークの PR に秘密を渡さない）。手順は docs/dev/deploy-actions.md。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: デプロイ先
        type: choice
        options: [demo, dev]
        default: demo

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'dev' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    # 手で押すときも main からだけ
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 秘密は GitHub の Environment（dev・demo）ごとに置く。demo は人の承認を付ける
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.target }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'dev' || inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 秘密は wrangler の 2 つの段にだけ渡す（依存の install・build には渡さない）
      - run: npm ci
      - run: npm run check
      - name: D1 の migration（main にある SQL だけ）
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: デプロイ
        run: npx wrangler deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
