<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ear-to-ear 試作</title>
<style>
/* ear-to-ear 再設計の試作（11-04 の時点。実装は 11-05 に変わった: docs/design/design-concept.md §8、design-system.md §0）。値は docs/design/design-system.md の §3〜§8 と同じ。
   単一テーマ（ライト固定。地図の上は暗い札＋白文字）。データはすべて架空、写真と下地は合成。 */
:root{
  --palette-ink-900:#1f2429; --palette-ink-700:#4a535c; --palette-ink-500:#6b737c;
  --palette-ink-300:rgba(0,0,0,.24); --palette-ink-100:rgba(0,0,0,.08);
  --palette-paper-000:#ffffff; --palette-paper-100:#f4f6f8;
  --palette-blue-600:#1f6fb5; --palette-blue-700:#195d98; --palette-blue-050:#e8f1fa;
  --palette-wheat-400:#d9b44a; --palette-wheat-700:#8a6a12;
  --palette-green-700:#3f7a1e; --palette-green-050:#e9f3e1;
  --palette-slate-600:#5a6670; --palette-slate-050:#eef0f2;
  --palette-red-600:#d93a1e; --palette-red-050:#fdeeea;
  --palette-shade-800:rgba(20,24,28,.78); --palette-shade-000:rgba(255,255,255,.92);

  --text-1:var(--palette-ink-900); --text-2:var(--palette-ink-700); --text-3:var(--palette-ink-500);
  --text-on-dark:var(--palette-paper-000);
  --background-2:var(--palette-paper-100); --surface:var(--palette-paper-000);
  --border:var(--palette-ink-100); --border-strong:var(--palette-ink-300);
  --brand:var(--palette-blue-600); --brand-hover:var(--palette-blue-700); --brand-soft:var(--palette-blue-050);
  --benchmark:var(--palette-wheat-400); --benchmark-ink:var(--palette-wheat-700);
  --fill-ready:var(--palette-green-700); --fill-done:var(--palette-slate-600); --fill-alpha:.45;
  --map-outline:#ffffff; --map-outline-under:rgba(0,0,0,.55); --map-selected:var(--palette-blue-600);
  --map-label-bg:var(--palette-shade-800); --map-control-bg:var(--palette-shade-000);
  --rank-draft:var(--palette-blue-600); --rank-final-bg:var(--palette-blue-600);
  --pending-dot:var(--palette-wheat-400);
  --assertive:var(--palette-red-600); --assertive-soft:var(--palette-red-050);
  --focus-ring:0 0 0 4px rgba(31,111,181,.32); --disabled-opacity:.32;

  --font:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  --space-4:4px; --space-8:8px; --space-16:16px; --space-24:24px;
  --sheet-peek:160px; --sheet-half:52vh;
  --radius-4:4px; --radius-8:8px; --radius-16:16px;
  --duration-fast:100ms; --duration-base:150ms; --duration-enter:250ms;
  color-scheme:light;
}
@media (prefers-reduced-motion:reduce){:root{--duration-fast:0ms;--duration-base:0ms;--duration-enter:0ms}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--background-2);color:var(--text-1);font-family:var(--font);font-size:18px;line-height:1.6;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-break:strict;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}

/* 帯 */
.bar{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar .logo{font-weight:700;font-size:17px;white-space:nowrap}
.bar .district{flex:1;display:flex;justify-content:center;min-width:0}
.bar select{height:44px;min-width:104px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 8px;font-weight:700;font-size:16px;max-width:100%}
.bar .btn.sm{padding:0 10px;font-size:16px}
.bar .demo{font-size:14px;color:var(--text-2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.bar .demo input{width:22px;height:22px;margin:0}

/* 本体 */
.main{flex:1;position:relative;min-height:0}
.mapwrap{position:absolute;inset:0;overflow:hidden;background:#6f7a52;touch-action:none;user-select:none;-webkit-user-select:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world canvas{display:block;width:1600px;height:1200px}
.world svg{position:absolute;left:0;top:0;width:1600px;height:1200px;overflow:visible}
.parcel{fill:transparent;stroke:var(--map-outline);stroke-width:2;cursor:pointer;outline:none;vector-effect:non-scaling-stroke}
.parcel-under{fill:none;stroke:var(--map-outline-under);stroke-width:6;vector-effect:non-scaling-stroke;pointer-events:none}
.parcel.ready{fill:var(--fill-ready);fill-opacity:var(--fill-alpha)}
.parcel.done{fill:url(#hatch)}
.parcel.selected{stroke-width:4}
.parcel-inner{fill:none;stroke:var(--map-selected);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;display:none}
.parcel-inner.on{display:block}
.parcel:focus-visible{stroke:var(--map-selected);stroke-width:5}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.lab .bm{background:var(--benchmark);color:var(--benchmark-ink);border:1px solid var(--benchmark-ink);font-size:13px;font-weight:700;line-height:1.3;padding:1px 8px;border-radius:4px}
.lab .row{display:flex;align-items:center;gap:4px;position:relative}
.lab .box{background:var(--map-label-bg);color:var(--text-on-dark);border-radius:4px;padding:2px 8px;font-size:14px;font-weight:700;line-height:1.35;text-align:left}
.lab .box .l2{display:block;font-weight:700}
.lab .box.ready .l2{color:#bfe3a3}
.lab .box.done .l2{color:#d2d8de}
.lab.compact .nm,.lab.compact .bm{display:none}
.lab.selected .nm{display:inline}.lab.selected .bm{display:block}
.rank{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:0 0 auto;background:var(--surface);color:var(--rank-draft);border:2px dashed var(--rank-draft)}
.rank.final{background:var(--rank-final-bg);color:var(--text-on-dark);border:2px solid var(--rank-final-bg)}
.lab .pend{position:absolute;right:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--pending-dot);border:1px solid var(--benchmark-ink)}
.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:8px}
.mapctl button{width:44px;height:44px;border-radius:8px;border:1px solid var(--border-strong);background:var(--map-control-bg);font-size:22px;font-weight:700;line-height:1}
.attrib{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;background:var(--map-control-bg);border:1px solid var(--border-strong);border-radius:4px;font-size:12px;padding:2px 8px;color:var(--text-2)}
.legend{position:absolute;left:0;right:0;bottom:0;min-height:44px;background:var(--map-control-bg);border-top:1px solid var(--border-strong);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:14px;color:var(--text-1);
  padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:16px;height:16px;border:1px solid var(--text-2);border-radius:3px;background:var(--surface)}
.legend i.ready{background:rgba(63,122,30,.55)}
.legend i.done{background:repeating-linear-gradient(135deg,var(--fill-done) 0 2px,transparent 2px 7px)}
.legend i.draft{border:2px dashed var(--rank-draft);border-radius:50%}
.legend i.final{background:var(--rank-final-bg);border-color:var(--rank-final-bg);border-radius:50%}
.legend i.bm{background:var(--benchmark);border-color:var(--benchmark-ink)}
.mapnote{position:absolute;left:0;right:0;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;font-size:17px;color:var(--text-2);display:none}
.mapnote.on{display:block}

/* シート */
.sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-peek);background:var(--background-2);border-top:1px solid var(--border-strong);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transition:height var(--duration-enter) ease-out}
.sheet[data-state="hidden"]{display:none}
.sheet[data-state="half"]{height:var(--sheet-half)}
.sheet[data-state="full"]{height:calc(100% - 16px)}
.sheet.dragging{transition:none}
.grip{height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grip span{width:36px;height:4px;border-radius:2px;background:var(--border-strong)}
.sheetbody{flex:1;min-height:0;overflow:hidden;padding:0 max(16px,env(safe-area-inset-left,0px)) 24px}
.sheet[data-state="full"] .sheetbody,.sheet[data-state="half"] .sheetbody{overflow:auto}
.sheethead{display:flex;align-items:flex-start;gap:8px;min-height:44px}
.sheethead h2{margin:0;font-size:1.2rem;line-height:1.4;flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sheethead .close{width:44px;height:44px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-size:20px;flex:0 0 auto}
.tabs{display:none;gap:8px;margin:0 0 12px}
.tabs button{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}

.chip{display:inline-block;font-size:15px;font-weight:700;line-height:1.4;padding:1px 8px;border-radius:4px;white-space:nowrap;vertical-align:middle}
.chip.bm{background:var(--benchmark);color:var(--benchmark-ink);border:1px solid var(--benchmark-ink)}
.chip.ready{background:var(--fill-ready);color:var(--text-on-dark)}
.chip.done{background:var(--fill-done);color:var(--text-on-dark)}
.chip.none{border:1px solid var(--border-strong);color:var(--text-2)}
.chip.year{background:var(--brand-soft);color:var(--brand)}
.chip.syn{position:absolute;left:6px;top:6px;background:var(--map-label-bg);color:var(--text-on-dark);font-size:12px}
.chip.other{background:var(--palette-slate-050);color:var(--text-2);border:1px solid var(--border-strong)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 20px;border-radius:16px;font-weight:700;border:1px solid transparent;background:var(--surface);color:var(--brand);transition:background-color var(--duration-base),transform var(--duration-fast) ease-out;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--text-on-dark)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.secondary{border-color:var(--border-strong)}
.btn.secondary:hover{background:var(--brand-soft)}
.btn.danger{border-color:var(--assertive);color:var(--assertive)}
.btn.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.btn.sm{min-height:44px;padding:0 14px;border-radius:12px;font-size:17px}
.btn:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.btn[disabled]{opacity:var(--disabled-opacity);cursor:default}
.btn[aria-busy="true"]{opacity:1}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.note{font-size:17px;color:var(--text-2);margin:0}
.msg{font-size:17px;font-weight:700;color:var(--fill-ready);margin:4px 0 0;min-height:1.6em}
.msg.err{color:var(--assertive)}
h3{font-size:1.2rem;line-height:1.4;margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border-strong)}
h3 small{font-weight:400;font-size:17px;color:var(--text-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.seg .btn{min-height:48px;border-radius:12px}

/* 比較 */
.cmphead{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;background:var(--background-2);padding:4px 0;font-size:15px;color:var(--text-2);z-index:2}
.cmphead b{color:var(--text-1);font-size:17px}
.cmphead.one{grid-template-columns:1fr}
.day{position:sticky;top:34px;background:var(--background-2);font-weight:700;padding:6px 0 4px;z-index:1}
.cmprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cmprow.one{grid-template-columns:1fr}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--border);display:block;padding:0;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.empty{border:1px dashed var(--border-strong);background:var(--background-2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;color:var(--text-2);padding:8px}
.cap{font-size:15px;color:var(--text-2);margin-top:2px}
.pick{min-height:56px;border-radius:12px;border:1px dashed var(--border-strong);background:var(--surface);color:var(--brand);font-weight:700;width:100%}

/* 昨年 */
.last{border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:12px;margin-top:8px}
.last .ttl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}

/* 判断 */
.reasons{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.reasons .btn{justify-content:flex-start;min-height:52px;border-radius:12px}
textarea{width:100%;min-height:72px;border:1px solid var(--border-strong);border-radius:8px;padding:10px 14px;background:var(--surface);resize:vertical}
.refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.refs .ph{cursor:pointer}
.refs .ph.on{outline:3px solid var(--brand);outline-offset:-3px}

/* 記録 */
.rec{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:17px}
.rec.revoked{border-style:dashed;color:var(--text-3)}
.rec .nogr{color:var(--text-3)}
.cite{color:var(--brand);font-weight:700;background:none;border:0;padding:0 2px;font-size:inherit;text-decoration:underline}
.citebox{background:var(--brand-soft);border-radius:8px;padding:8px 12px;font-size:16px;margin:4px 0 8px}

/* 順番 */
.ordhead{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ordhead .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warn{background:#fff6dc;border-left:6px solid var(--benchmark-ink);border-radius:8px;padding:8px 12px;font-size:17px}
.grp{font-weight:700;color:var(--text-2);font-size:17px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--border-strong)}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:24px}
.olist.target{outline:2px dashed var(--brand);outline-offset:4px;border-radius:8px}
.orow{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:grid;grid-template-columns:36px 72px 1fr auto;gap:8px;align-items:center;padding:8px;border-left-width:6px;border-left-color:var(--border)}
.orow.ready{border-left-color:var(--fill-ready)}
.orow.done{border-left-color:var(--fill-done)}
.orow.selected{outline:2px solid var(--brand)}
.orow.lifted{outline:2px solid var(--brand);background:var(--brand-soft);pointer-events:none}
.orow .rank{width:36px;height:36px}
.orow .nor{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3)}
.orow .th{width:72px;height:54px;border-radius:4px;overflow:hidden;background:var(--background-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-3)}
.orow .th img{width:100%;height:100%;object-fit:cover;display:block}
.orow .mid{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:17px}
.orow .mid .nm{font-weight:700;font-size:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.orow .mid .why{color:var(--text-2);font-size:16px}
.orow .mid .miss{color:var(--text-2);font-size:16px}
.orow .ctl{display:flex;align-items:center;gap:4px}
.handle{width:56px;height:56px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;cursor:grab}
.handle i{display:block;width:22px;height:3px;background:var(--text-2);border-radius:2px}
.updn{display:none;flex-direction:column;gap:4px}
.updn button{width:44px;height:26px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;line-height:1}
.buttons-mode .updn{display:flex}
.buttons-mode .handle{display:none}
.used{font-size:16px;color:var(--text-2);margin-top:16px;border-top:1px solid var(--border);padding-top:8px}
.foot{font-size:15px;color:var(--text-3);margin-top:24px;border-top:1px solid var(--border);padding-top:8px}
.switch{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text-2);min-height:44px}
.switch input{width:22px;height:22px;margin:0}

/* 広い画面 */
@media (min-width:960px){
  .main{display:grid;grid-template-columns:1fr 400px}
  .mapwrap{position:relative;inset:auto;min-height:100%}
  .sheet{position:static;height:auto !important;border-top:0;border-left:1px solid var(--border-strong);border-radius:0;transition:none}
  .sheet[data-state="hidden"]{display:flex}
  .grip{display:none}
  .sheetbody{overflow:auto !important;padding-top:12px}
  .tabs{display:flex}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo">ear-to-ear</div>
    <div class="district"><label class="sr" for="district" hidden>地区</label>
      <select id="district" aria-label="地区"><option>北地区</option><option>中地区</option><option>南地区</option></select></div>
    <label class="demo" title="デモ用: 委員長として見る"><input type="checkbox" id="adminToggle">委員長</label>
    <button type="button" class="btn secondary sm" id="uploadBtn">写真を送る</button>
  </header>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <div class="world" id="world">
        <canvas id="base" width="1600" height="1200" aria-hidden="true"></canvas>
        <svg id="parcels" viewBox="0 0 1600 1200" aria-label="圃場の地図">
          <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(90,102,112,.25)"/><rect width="2.5" height="8" fill="#5a6670"/></pattern></defs>
          <g id="gUnder"></g><g id="gFill"></g><g id="gInner"></g>
        </svg>
      </div>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="mapnote" id="mapnote"></div>
      <div class="mapctl"><button type="button" id="zin" aria-label="拡大">＋</button><button type="button" id="zout" aria-label="縮小">－</button></div>
      <div class="attrib">架空の村（合成の下地。本番は地理院タイル）</div>
      <div class="legend" id="legend">
        <span><i class="ready"></i>収穫可能（人の判断）</span><span><i class="done"></i>収穫済</span><span><i></i>未確認</span>
        <span><i class="draft"></i>仮の順</span><span><i class="final"></i>確定した順</span><span><i class="bm"></i>目安の畑</span>
      </div>
    </div>
    <aside class="sheet" id="sheet" data-state="hidden" aria-label="圃場の情報">
      <div class="grip" id="grip"><span></span></div>
      <div class="sheetbody" id="sheetbody"></div>
    </aside>
  </div>
</div>

<script>
'use strict';
/* ========= 架空のデータ（実在の場所・人・写真ではない） ========= */
const NOW = '2026-07-22';            // 「今」。水曜日
const SEASON = '2026', LAST = '2025';
const FIELDS = [
  // 地区ごとに 2×2 の塊（スマホの縦画面で 1 地区が収まる）。P15 の四角を崩した架空の形
  {id:'A-01',name:'北の1',district:'北地区',poly:[[162,158],[432,152],[438,330],[166,336]]},
  {id:'A-02',name:'北の2',district:'北地区',poly:[[492,154],[762,160],[758,334],[488,328]]},
  {id:'A-03',name:'北の3',district:'北地区',poly:[[164,392],[434,386],[430,562],[160,556]]},

function pathD(f){ return f.poly.map(([x,y],i) => (i ? 'L' : 'M') + x + ' ' + y).join(' ') + ' Z'; }
function buildParcels(){

    const d = pathD(f);
    under.insertAdjacentHTML('beforeend', `<path class="parcel-under" d="${d}"/>`);
    fill.insertAdjacentHTML('beforeend', `<path class="parcel" data-field="${f.id}" d="${d}" role="button" tabindex="0"/>`);
    inner.insertAdjacentHTML('beforeend', `<path class="parcel-inner" data-inner="${f.id}" d="${d}"/>`);
    const lab = document.createElement('div'); lab.className = 'lab'; lab.dataset.lab = f.id; labels.appendChild(lab);
  });
  fill.addEventListener('keydown', e => { const t = e.target.closest('[data-field]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(t.dataset.field); } });
}
function paintParcels(){
  FIELDS.forEach(f => {
    const p = $(`[data-field="${f.id}"]`), st = STATUS[f.id]; const sel = state.selected === f.id;
    p.classList.toggle('ready', !!st && st.status === 'ready'); p.classList.toggle('done', !!st && st.status === 'done'); p.classList.toggle('selected', sel);
    $(`[data-inner="${f.id}"]`).classList.toggle('on', sel);
    const bm = SEASONS[SEASON][f.id] && SEASONS[SEASON][f.id].benchmark; const rk = f.district === state.district ? rankOf(f.id) : null; const o = ORDERS[f.district];
    p.setAttribute('aria-label', `${f.id} ${f.name}、${st ? (st.status === 'ready' ? '収穫可能 ' : '収穫済 ') + md(st.at.slice(0,10)) : '未確認'}${rk ? `、${o.state === 'confirmed' ? '確定した順' : '仮の順'} ${rk}` : ''}${bm ? '、目安の畑' : ''}`);
    const lab = $(`[data-lab="${f.id}"]`);
    lab.innerHTML = `${bm ? '<span class="bm">目安</span>' : ''}<div class="row">${rk ? `<span class="rank${o.state === 'confirmed' ? ' final' : ''}">${rk}</span>` : ''}<span class="box${st ? ' ' + st.status : ''}"><span class="l1">${f.id}<span class="nm"> ${esc(f.name)}</span></span><span class="l2">${st ? (st.status === 'ready' ? '可 ' : '済 ') + md(st.at.slice(0,10)) : '未確認'}</span></span>${UNCONFIRMED[f.id] ? '<span class="pend"></span>' : ''}</div>`;

}
function placeLabels(){
  const compact = view.s < .42;
  FIELDS.forEach(f => { const lab = $(`[data-lab="${f.id}"]`); const c = centroid(f); lab.style.left = (c[0]*view.s + view.tx) + 'px'; lab.style.top = (c[1]*view.s + view.ty) + 'px'; lab.classList.toggle('compact', compact && state.selected !== f.id); lab.style.fontSize = view.s >= 1.5 ? '16px' : '14px'; });
}

/* ========= 状態 ========= */
const state = { district:'北地区', selected:null, mode:'field', compare:'two', partner:null, picking:false, buttonsMode:reduced, admin:false,
  form:{status:null, reasons:new Set(), note:'', refs:new Set()}, confirmArm:null, msg:{}, openCite:null };
function select(id){
  const f = byId(id); if (!f) return;
  if (state.district !== f.district) { state.district = f.district; $('#district').value = f.district; }
  if (state.picking) { state.partner = id; state.picking = false; state.compare = 'two'; renderSheet(); setSheet('half'); paintParcels(); return; }
  if (state.selected !== id) { state.selected = id; state.form = {status:null, reasons:new Set(), note:'', refs:new Set()}; state.partner = null; state.msg = {}; state.openCite = null; }
  try { history.replaceState(null, '', '#' + id); } catch {}
  if ($('#sheet').dataset.state === 'hidden') setSheet('peek');
  paintParcels(); renderSheet(); body.scrollTop = 0; if (wide()) centerOn(f);
}
function deselect(){ if (!state.selected) return; state.selected = null; state.picking = false; try { history.replaceState(null, '', location.pathname); } catch {} setSheet('hidden'); paintParcels(); renderSheet(); }
$('#district').addEventListener('change', e => { state.district = e.target.value; state.selected = null; state.partner = null; state.mode = 'field'; setSheet('hidden'); paintParcels(); renderSheet(); fit(FIELDS.filter(f => f.district === state.district), true); });
$('#adminToggle').addEventListener('change', e => { state.admin = e.target.checked; renderSheet(); });
$('#uploadBtn').addEventListener('click', () => { const n = $('#mapnote'); n.textContent = '試作では「写真を送る」（/upload）は開きません。本番の L0 の画面をそのまま使います。'; n.classList.add('on'); setTimeout(() => n.classList.remove('on'), 4000); });

/* ========= シートの段 ========= */
const sheet = $('#sheet'), grip = $('#grip');
function setSheet(s){ sheet.dataset.state = s; $('#legend').style.display = (s === 'hidden' || wide()) ? '' : 'none'; }
let sg = null;
grip.addEventListener('pointerdown', e => { if (wide()) return; grip.setPointerCapture(e.pointerId); sg = { y0:e.clientY, h0:sheet.getBoundingClientRect().height, t0:Date.now(), moved:false }; sheet.classList.add('dragging'); });
grip.addEventListener('pointermove', e => { if (!sg) return; const dy = e.clientY - sg.y0; if (Math.abs(dy) > 4) sg.moved = true; const H = sheet.parentElement.clientHeight; sheet.style.height = Math.max(160, Math.min(H - 16, sg.h0 - dy)) + 'px'; });
function gripEnd(e){ if (!sg) return; const H = sheet.parentElement.clientHeight; const h = sheet.getBoundingClientRect().height; const dy = e.clientY - sg.y0; const v = dy / Math.max(1, Date.now() - sg.t0);
  let next; const order = ['peek','half','full']; const cur = sheet.dataset.state;
  if (!sg.moved) next = order[Math.min(2, order.indexOf(cur) + 1)];
  else if (Math.abs(v) > .5 || Math.abs(dy) > 64) { const i = order.indexOf(cur); next = order[Math.max(0, Math.min(2, i + (dy < 0 ? 1 : -1)))]; }
  else { const hs = {peek:160, half:H*.52, full:H-16}; next = order.reduce((a,b) => Math.abs(hs[b]-h) < Math.abs(hs[a]-h) ? b : a); }
  sheet.classList.remove('dragging'); sheet.style.height = ''; setSheet(next); sg = null; }
grip.addEventListener('pointerup', gripEnd); grip.addEventListener('pointercancel', gripEnd);

/* ========= シートの中身 ========= */
const body = $('#sheetbody');
function renderSheet(){
  if (!state.selected && !wide()) { body.innerHTML = ''; return; }
  const tabs = wide() ? `<div class="tabs"><button type="button" aria-pressed="${state.mode === 'field'}" data-mode="field">写真</button><button type="button" aria-pressed="${state.mode === 'order'}" data-mode="order">順番</button></div>` : '';
  let html = tabs;
  if (state.mode === 'order' || (!state.selected && wide())) html += renderOrder(); else html += renderField();
  body.innerHTML = html; wire();
}
function chipStatus(fid){ const st = STATUS[fid]; return st ? `<span class="chip ${st.status}">${st.status === 'ready' ? '可' : '済'} ${md(st.at.slice(0,10))}</span>` : '<span class="chip none">未確認</span>'; }
function chipBm(fid){ return SEASONS[SEASON][fid] && SEASONS[SEASON][fid].benchmark ? '<span class="chip bm">目安</span>' : ''; }
function phCell(p, cap){ return p ? `<div><button type="button" class="ph" data-photo="${p.id}" aria-label="写真を大きく見る（${md(p.date)}・${p.fieldId}）"><img src="${photoURL(p)}" alt=""><span class="chip syn">合成</span></button><div class="cap">${cap}</div></div>` : `<div><div class="ph empty">この日の写真はありません</div><div class="cap">${cap}</div></div>`; }

function renderField(){
  const f = byId(state.selected); const season = SEASONS[SEASON][f.id] || {crop:'—'}; const wheat = season.crop === '小麦';

  if (!dates.length) h += `<div class="cmprow ${two ? '' : 'one'}">${two ? '<div><div class="ph empty">今年の写真はまだありません</div></div>' : ''}<div><div class="ph empty">今年の写真はまだありません。「写真を送る」から送れます</div></div></div>`;

}
function renderLast(f, partner){

  const row = (id, i, grp) => { const f = byId(id); const st = STATUS[id]; const p = latestPhoto(id); const rs = (o.reasons[id] || []); const ms = (o.missing[id] || []);
    return `<li class="orow ${st ? st.status : ''} ${state.selected === id ? 'selected' : ''}" data-row="${id}" data-grp="${grp}">${grp === 'ranked' ? `<span class="rank ${o.state === 'confirmed' ? 'final' : ''}">${i+1}</span>` : '<span class="nor" aria-hidden="true">—</span>'}<div class="th">${p ? `<img src="${photoURL(p)}" alt="">` : '写真なし'}</div><div class="mid"><div class="nm"><button type="button" class="cite" style="text-decoration:none;color:var(--text-1)" data-sel="${id}">${id} ${esc(f.name)}</button>${chipBm(id)}${chipStatus(id)}</div>${rs.length ? `<div class="why">${rs.map(r => esc(r.text) + r.cites.map(c => `<button type="button" class="cite" data-cite="${c}">[${citeNo(c)}]</button>`).join('')).join('。')}</div>` : ''}${ms.length ? `<div class="miss">足りない: ${esc(ms.join('、'))}</div>` : ''}${state.openCite && rs.some(r => r.cites.includes(state.openCite)) ? `<div class="citebox">${esc(RECORDS[state.openCite] || '')}</div>` : ''}</div><div class="ctl"><div class="updn"><button type="button" data-up="${id}" aria-label="上へ">▲</button><button type="button" data-down="${id}" aria-label="下へ">▼</button></div><div class="handle" data-handle="${id}" role="button" aria-label="${id} を動かす"><i></i><i></i><i></i></div></div></li>`; };

  const cnt = { st: FIELDS.filter(f => f.district === d && STATUS[f.id]).length, ph: PHOTOS.filter(p => byId(p.fieldId).district === d && p.date.startsWith(SEASON)).length, hv: FIELDS.filter(f => f.district === d && SEASONS[LAST][f.id] && SEASONS[LAST][f.id].harvestedOn).length };

  const unc = FIELDS.filter(f => f.district === d).reduce((a,f) => a + (UNCONFIRMED[f.id] || 0), 0);
  if (unc) h += `<p class="note">未確定の写真 ${unc}枚 → 新着で番号を付ける</p>`;
  h += `<p class="foot">この仮の順は固定の架空データ（Claude は呼んでいない）。本番は Worker が記録から作る。</p>`;
  return h;
}
const CITES = Object.keys(RECORDS); function citeNo(c){ return CITES.indexOf(c) + 1; }

/* ========= 配線 ========= */
function wire(){
  body.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; renderSheet(); body.scrollTop = 0; }));
  body.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act, b)));
  body.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', () => { state.form.status = b.dataset.status; keepScroll(renderSheet); }));
  body.querySelectorAll('[data-reason]').forEach(b => b.addEventListener('click', () => { const r = b.dataset.reason; state.form.reasons.has(r) ? state.form.reasons.delete(r) : state.form.reasons.add(r); keepScroll(renderSheet); }));
  body.querySelectorAll('[data-ref]').forEach(b => b.addEventListener('click', () => { const r = b.dataset.ref; if (state.form.refs.has(r)) state.form.refs.delete(r); else if (state.form.refs.size < 5) state.form.refs.add(r); keepScroll(renderSheet); }));
  const note = $('#note'); if (note) note.addEventListener('input', () => state.form.note = note.value);
  body.querySelectorAll('[data-cite]').forEach(b => b.addEventListener('click', () => { state.openCite = state.openCite === b.dataset.cite ? null : b.dataset.cite; keepScroll(renderSheet); }));
  body.querySelectorAll('[data-photo]').forEach(b => b.addEventListener('click', () => { const n = $('#mapnote'); n.textContent = '本番では元の大きさの写真が新しいタブで開きます（/api/photo-files/:id）。試作の写真は合成です。'; n.classList.add('on'); setTimeout(() => n.classList.remove('on'), 3500); }));
  body.querySelectorAll('[data-sel]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.sel; state.selected = id; state.form = {status:null, reasons:new Set(), note:'', refs:new Set()}; try { history.replaceState(null, '', '#' + id); } catch {} paintParcels(); centerOn(byId(id)); keepScroll(renderSheet); }));
  body.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => moveRow(b.dataset.up, -1)));
  body.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => moveRow(b.dataset.down, +1)));
  const bm = $('#btnMode'); if (bm) bm.addEventListener('change', () => { state.buttonsMode = bm.checked; keepScroll(renderSheet); });
  body.classList.toggle('buttons-mode', state.buttonsMode);
  body.querySelectorAll('[data-handle]').forEach(hd => hd.addEventListener('pointerdown', dragStart));
}
function keepScroll(fn){ const y = body.scrollTop; fn(); body.scrollTop = y; }
function act(a, btn){
  const f = state.selected ? byId(state.selected) : null; const o = ORDERS[state.district];
  if (a === 'close') deselect();
  else if (a === 'close-order') { state.mode = 'field'; if (!state.selected) setSheet('hidden'); renderSheet(); body.scrollTop = 0; }
  else if (a === 'half') { state.compare = 'two'; setSheet('half'); keepScroll(renderSheet); }
  else if (a === 'order') { state.mode = 'order'; renderSheet(); body.scrollTop = 0; if (!wide()) setSheet('full'); }
  else if (a === 'cmp-two') { state.compare = 'two'; keepScroll(renderSheet); }
  else if (a === 'cmp-one') { state.compare = 'one'; keepScroll(renderSheet); }
  else if (a === 'pick') { state.picking = true; keepScroll(renderSheet); setSheet('peek'); const n = $('#mapnote'); n.textContent = '地図で比べる相手の輪郭を押してください'; n.classList.add('on'); setTimeout(() => n.classList.remove('on'), 4000); }
  else if (a === 'save-status') {
    const fm = state.form; if (!fm.status) state.msg.judge = {err:true, text:'「収穫可能」か「収穫済」を選んでください'};
    else if (!fm.reasons.size) state.msg.judge = {err:true, text:'理由を 1 つ以上選んでください'};
    else { const at = NOW + ' 10:12'; STATUS[f.id] = {status:fm.status, at, reasons:[...fm.reasons], note:fm.note, refs:[...fm.refs]};
      (HISTORY[f.id] = HISTORY[f.id] || []).unshift({id:'s-' + f.id + '-' + Date.now(), status:fm.status, at, reasons:[...fm.reasons], refs:fm.refs.size});
      const oo = ORDERS[f.district]; if (oo.missing[f.id]) oo.missing[f.id] = oo.missing[f.id].filter(m => m !== '判断');
      state.msg.judge = {text:'残しました（この画面の中だけ）。地図の塗りと仮の順に反映されます'}; state.form = {status:null, reasons:new Set(), note:'', refs:new Set()}; paintParcels(); }
    keepScroll(renderSheet);
  }
  else if (a === 'save-order') { o.saved = true; state.msg.order = {text:'仮の順を保存しました（この画面の中だけ）'}; keepScroll(renderSheet); }
  else if (a === 'confirm1') { state.confirmArm = state.district; keepScroll(renderSheet); clearTimeout(state.armT); state.armT = setTimeout(() => { state.confirmArm = null; keepScroll(renderSheet); }, 5000); }
  else if (a === 'confirm2') { clearTimeout(state.armT); state.confirmArm = null; o.state = 'confirmed'; o.saved = true; o.confirmedAt = md(NOW) + ' 10:15'; state.msg.order = {text:'確定しました。地図の番号が実線になりました'}; paintParcels(); keepScroll(renderSheet); }
}
function moveRow(id, dir){
  const o = ORDERS[state.district]; let list = o.ranked.includes(id) ? o.ranked : o.insufficient; const i = list.indexOf(id);
  if (list === o.insufficient && dir < 0 && i === 0) { o.insufficient.splice(i, 1); o.ranked.push(id); }
  else if (list === o.ranked && dir > 0 && i === o.ranked.length - 1) { o.ranked.splice(i, 1); o.insufficient.unshift(id); }
  else { const j = i + dir; if (j < 0 || j >= list.length) return; list.splice(i, 1); list.splice(j, 0, id); }
  o.saved = false; paintParcels(); keepScroll(renderSheet);
}
// 持ち手のドラッグ（行をその場で入れ替える。行は指に追従させず、隣の行の中央を越えたら入れ替わる）
let drag = null;
function dragStart(e){
  const id = e.currentTarget.dataset.handle; const row = body.querySelector(`[data-row="${id}"]`); if (!row) return;
  e.currentTarget.setPointerCapture(e.pointerId); drag = { id, row, hd:e.currentTarget }; row.classList.add('lifted'); $('#rankedList').classList.add('target'); $('#insufList').classList.add('target');
  e.currentTarget.addEventListener('pointermove', dragMove); e.currentTarget.addEventListener('pointerup', dragEnd); e.currentTarget.addEventListener('pointercancel', dragEnd);
}
function dragMove(e){
  if (!drag) return; const el = document.elementFromPoint(e.clientX, e.clientY); if (!el) return;
  const over = el.closest('[data-row]'); const list = el.closest('[data-list]');
  if (over && over !== drag.row && over.dataset.grp !== undefined) { const r = over.getBoundingClientRect(); if (e.clientY < r.top + r.height/2) over.before(drag.row); else over.after(drag.row); }
  else if (list && !list.contains(drag.row)) list.appendChild(drag.row);
  // シートの端で自動スクロール
  const br = body.getBoundingClientRect(); if (e.clientY > br.bottom - 48) body.scrollTop += 8; else if (e.clientY < br.top + 48) body.scrollTop -= 8;
}
function dragEnd(){
  if (!drag) return; const o = ORDERS[state.district];
  const ranked = [...$('#rankedList').querySelectorAll('[data-row]')].map(r => r.dataset.row), insuf = [...$('#insufList').querySelectorAll('[data-row]')].map(r => r.dataset.row);
  const changed = ranked.join() !== o.ranked.filter(x => !(STATUS[x] && STATUS[x].status === 'done')).join() || insuf.join() !== o.insufficient.join();
  o.ranked = ranked; o.insufficient = insuf; if (changed) o.saved = false; drag.row.classList.remove('lifted'); drag = null; paintParcels(); keepScroll(renderSheet);
}

/* ========= 起動 ========= */
drawBase(); buildParcels(); paintParcels();
fit(FIELDS.filter(f => f.district === state.district), false);
const h0 = (location.hash || '').replace('#', ''); if (byId(h0)) select(h0); else if (wide()) renderSheet();
addEventListener('resize', () => { if (!state.selected) fit(FIELDS.filter(f => f.district === state.district), false); placeLabels(); renderSheet(); setSheet(sheet.dataset.state); });
addEventListener('hashchange', () => { const id = (location.hash || '').replace('#', ''); if (byId(id)) select(id); });
</script>
</body>
